<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حجز حصة تجريبية مجانية | أكاديمية القارئ</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <!-- Facebook Domain Verification -->
    <meta name="facebook-domain-verification" content="b0ya1igfwfctsyfif7f6wbqthtu5ta" />

    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .register-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 100%;
            text-align: center;
        }
        .register-card img {
            max-width: 90px;
            border-radius: 50%;
            margin-bottom: 15px;
        }
        .register-card h2 {
            color: #1B2A4A;
            margin-bottom: 10px;
        }
        .register-card p {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .form-group {
            text-align: right;
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-family: 'Tajawal', sans-serif;
            box-sizing: border-box;
        }
        .btn-submit {
            width: 100%;
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background-color: #219150;
        }
    </style>
</head>
<body>

<div class="register-card">
    <img src="assets/logo.jpg" alt="أكاديمية القارئ">
    <h2>حجز حصة تجريبية مجانية 🎁</h2>
    <p>قم بتعبئة البيانات وسيقوم فريق الأكاديمية بالتواصل معك للتنسيق.</p>

    <!-- استبدل الرابط في action برابط Formspree الخاص بك -->
    <form id="leadForm" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
        <div class="form-group">
            <label for="name">الاسم بالكامل:</label>
            <input type="text" id="name" name="name" placeholder="أدخل اسمك الكريم" required>
        </div>

        <div class="form-group">
            <label for="phone">رقم الواتساب (مع رمز الدولة):</label>
            <input type="tel" id="phone" name="phone" placeholder="مثال: 966500000000+" required>
        </div>

        <div class="form-group">
            <label for="program">البرنامج المطلوب:</label>
            <select id="program" name="program" required>
                <option value="" disabled selected>اختر البرنامج</option>
                <option value="حفظ القرآن الكريم">حفظ القرآن الكريم</option>
                <option value="التجويد وتصحيح القراءة">التجويد وتصحيح القراءة</option>
                <option value="نور البيان للأطفال">نور البيان للأطفال</option>
                <option value="العلوم الشرعية والتفسير">العلوم الشرعية والتفسير</option>
            </select>
        </div>

        <button type="submit" class="btn-submit">حجز الحصة الآن 🚀</button>
    </form>
</div>

<script>
  // تتبع حدث "Lead" في البيكسل بمجرد أن يضغط العميل على إرسال
  document.getElementById('leadForm').addEventListener('submit', function() {
      if (typeof fbq !== 'undefined') {
          fbq('track', 'Lead');
      }
  });
</script>

</body>
  </html>
